services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: pnioyot-sql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Pnioyot_Sql_2024"
    ports:
      - "1433:1433"
    volumes:
      - pnioyot-sql-data:/var/opt/mssql

volumes:
  pnioyot-sql-data:
